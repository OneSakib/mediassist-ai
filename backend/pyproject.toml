[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mediassistant-ai"
version = "0.1.0"
description = "Production-ready FastAPI project boilerplate"
authors = [{ name = "Sakib Malik", email = "maliksakib347@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "email-validator>=2.2.0",
    "passlib[bcrypt]==1.7.4",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "bcrypt==4.0.1",
    "python-dotenv>=1.2.3",
    "langsmith>=0.14.1",
    "celery>=5.6.3",
    "redis==4.6.0",
    "psycopg2-binary>=2.9.13",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-chroma>=1.1.0",
    "pypdf>=6.19.0",
    "openpyxl>=3.1.5",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

# Without this, setuptools flat-layout auto-discovery sees both `app` and
# `tests` as top-level packages and refuses to build.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]



[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
plugins = []

